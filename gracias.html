<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messaggio inviato</title>
  <style>
    :root {
      --green: #4a7c59;
      --green-dark: #335f42;
      --bg: #eef4ef;
      --text: #1f2d2a;
      --muted: #4d5a58;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #edf4ee 0%, #dfead8 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .card {
      background: rgba(255,255,255,0.9);
      border-radius: 18px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(27, 54, 39, 0.12);
      max-width: 540px;
      width: calc(100% - 32px);
    }

    .badge {
      display: inline-block;
      background: var(--green);
      color: white;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 2.6rem);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .btn {
      display: inline-block;
      margin-top: 22px;
      background: var(--green);
      color: white;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 999px;
    }

    .btn:hover {
      background: var(--green-dark);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Successo</div>
    <h1>Messaggio inviato</h1>
    <p>Grazie per averci contattato. Ti risponderemo al più presto, di solito entro 24-48 ore.</p>
    <a class="btn" href="index.html">Torna alla home</a>
  </div>
</body>
</html>
